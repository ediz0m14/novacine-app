name: Compilar APK

# Cada cambio en main (o el botón «Run workflow») compila NovaCine.apk firmado
# y lo publica en «Releases» con el número de versión 1.0.N.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.NOVACINE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar la firma (desde los Secrets)
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/novacine.jks"
          echo "NOVACINE_KEYSTORE_FILE=$RUNNER_TEMP/novacine.jks" >> "$GITHUB_ENV"

      - name: Compilar
        env:
          NOVACINE_KEYSTORE_PASSWORD: ${{ secrets.NOVACINE_KEYSTORE_PASSWORD }}
          NOVACINE_KEY_ALIAS: ${{ secrets.NOVACINE_KEY_ALIAS }}
          NOVACINE_KEY_PASSWORD: ${{ secrets.NOVACINE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Nombrar el APK
        run: |
          f=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$f" NovaCine.apk
          ls -la NovaCine.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NovaCine-1.0.${{ github.run_number }}
          path: NovaCine.apk

      - name: Publicar en Releases
        if: env.KS_B64 != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NovaCine 1.0.${{ github.run_number }}
          body: APK de NovaCine para Android (versión 1.0.${{ github.run_number }}).
          files: NovaCine.apk
          make_latest: true
